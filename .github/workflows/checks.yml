name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: bash scripts/check.sh
      - name: Fly in the ArduPilot simulator
        run: |
          bash scripts/sim.sh --download-only
          DRONELOAD_SITL=1 python -m pytest -q tests/test_flight_sitl.py
